trigger:
  - main

pool:
  name: ram  # This is your custom agent pool name
  demands:
    - Agent.Name -equals terra  # Ensures pipeline runs only on agent named 'terra'

steps:
  - script: |
      echo "Running on agent: $(Agent.Name)"
      echo "Hello from your self-hosted agent!"
      dotnet --version
    displayName: 'Run Sample Script'
