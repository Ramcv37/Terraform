trigger:
- master

pool:
  name: default  # Using your self-hosted agent pool
  demands:
    - agent.name -equals Terraform

variables:
- group: terraform-secrets   # Your Azure DevOps variable group
- name: TF_IN_AUTOMATION
  value: 'true'
- name: TF_DIR
  value: 'Azure-VM-Ubunutu'

steps:
- checkout: self

- task: PowerShell@2
  displayName: 'Terraform Init'
  inputs:
    targetType: 'inline'
    script: |
      cd "$(TF_DIR)"
      terraform init

- task: PowerShell@2
  displayName: 'Terraform Import (One-Time)'
  inputs:
    targetType: 'inline'
    script: |
      cd "$(TF_DIR)"

      # Import Resource Group
      terraform state list | findstr azurerm_resource_group.rg > $null
      if (!$?) {
        Write-Host "Importing Resource Group..."
        terraform import azurerm_resource_group.rg /subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/Ram-linux-vm-rg
      } else {
        Write-Host "Resource Group already in state. Skipping import."
      }

      # Import Virtual Network
      terraform state list | findstr azurerm_virtual_network.vnet > $null
      if (!$?) {
        Write-Host "Importing Virtual Network..."
        terraform import azurerm_virtual_network.vnet /subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/Ram-linux-vm-rg/providers/Microsoft.Network/virtualNetworks/Ram-vnet
      } else {
        Write-Host "Virtual Network already in state. Skipping import."
      }

      # Import Network Security Group
      terraform state list | findstr azurerm_network_security_group.nsg > $null
      if (!$?) {
        Write-Host "Importing NSG..."
        terraform import azurerm_network_security_group.nsg /subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/Ram-linux-vm-rg/providers/Microsoft.Network/networkSecurityGroups/Ram-nsg
      } else {
        Write-Host "NSG already in state. Skipping import."
      }

      # Import Public IP
      terraform state list | findstr azurerm_public_ip.public_ip > $null
      if (!$?) {
        Write-Host "Importing Public IP..."
        terraform import azurerm_public_ip.public_ip /subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/Ram-linux-vm-rg/providers/Microsoft.Network/publicIPAddresses/Ram-public-ip
      } else {
        Write-Host "Public IP already in state. Skipping import."
      }

- task: PowerShell@2
  displayName: 'Terraform Plan'
  inputs:
    targetType: 'inline'
    script: |
      cd "$(TF_DIR)"
      terraform plan -out=tfplan

- task: PowerShell@2
  displayName: 'Terraform Apply'
  inputs:
    targetType: 'inline'
    script: |
      cd "$(TF_DIR)"
      terraform apply -auto-approve tfplan
