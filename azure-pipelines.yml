trigger:
- master

pool:
  name: default
  demands:
    - agent.name -equals Terraform

variables:
- group: terraform-secrets
- name: TF_IN_AUTOMATION
  value: 'true'
- name: TF_DIR
  value: 'Azure-VM-Ubunutu'

steps:
- checkout: self

- task: PowerShell@2
  displayName: 'Terraform Init'
  inputs:
    targetType: 'inline'
    script: |
      cd "$(TF_DIR)"
      terraform init

- task: PowerShell@2
  displayName: 'Terraform Import (One-Time)'
  inputs:
    targetType: 'inline'
    script: |
      cd "$(TF_DIR)"

      $resources = @(
        @{ name = "azurerm_resource_group.rg"; id = "/subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/Ram-linux-vm-rg" },
        @{ name = "azurerm_virtual_network.vnet"; id = "/subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/Ram-linux-vm-rg/providers/Microsoft.Network/virtualNetworks/Ram-vnet" },
        @{ name = "azurerm_network_security_group.nsg"; id = "/subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/Ram-linux-vm-rg/providers/Microsoft.Network/networkSecurityGroups/Ram-nsg" },
        @{ name = "azurerm_subnet.subnet"; id = "/subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/Ram-linux-vm-rg/providers/Microsoft.Network/virtualNetworks/Ram-vnet/subnets/Ram-subnet" },
        @{ name = "azurerm_public_ip.public_ip"; id = "/subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/Ram-linux-vm-rg/providers/Microsoft.Network/publicIPAddresses/Ram-public-ip" },
        @{ name = "azurerm_network_interface.nic"; id = "/subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/Ram-linux-vm-rg/providers/Microsoft.Network/networkInterfaces/Ram-nic" },
        @{ name = "azurerm_network_interface_security_group_association.nsg_assoc"; id = "/subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/Ram-linux-vm-rg/providers/Microsoft.Network/networkInterfaces/Ram-nic/networkSecurityGroup" },
        @{ name = "azurerm_linux_virtual_machine.vm"; id = "/subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/Ram-linux-vm-rg/providers/Microsoft.Compute/virtualMachines/Ram-vm" }
      )

      foreach ($res in $resources) {
        Write-Host "`nChecking $($res.name)..."
        $exists = terraform state list | Select-String $res.name
        if (-not $exists) {
          Write-Host "Importing $($res.name)..."
          terraform import $res.name $res.id
        } else {
          Write-Host "$($res.name) already in state. Skipping import."
        }
      }

- task: PowerShell@2
  displayName: 'Terraform Plan'
  inputs:
    targetType: 'inline'
    script: |
      cd "$(TF_DIR)"
      terraform plan -out=tfplan

- task: PowerShell@2
  displayName: 'Terraform Apply'
  inputs:
    targetType: 'inline'
    script: |
      cd "$(TF_DIR)"
      terraform apply -auto-approve tfplan
