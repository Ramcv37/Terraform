trigger:
- master

pool:
  name: default  # Using your self-hosted agent pool
  demands:
    - agent.name -equals Terraform

variables:
- group: terraform-secrets   # Your Azure DevOps variable group
- name: TF_IN_AUTOMATION
  value: 'true'
- name: TF_DIR
  value: 'Azure-VM-Ubunutu'

steps:
- checkout: self

- task: PowerShell@2
  displayName: 'Terraform Init'
  inputs:
    targetType: 'inline'
    script: |
      cd "$(TF_DIR)"
      terraform init

- task: PowerShell@2
  displayName: 'Terraform Import (One-Time)'
  inputs:
    targetType: 'inline'
    script: |
      cd "$(TF_DIR)"
      terraform state list | findstr azurerm_resource_group.rg > $null
      if (!$?) {
        Write-Host "Resource not in state. Importing..."
        terraform import azurerm_resource_group.rg /subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/Ram-linux-vm-rg
      } else {
        Write-Host "Resource already exists in state. Skipping import."
      }

- task: PowerShell@2
  displayName: 'Terraform Plan'
  inputs:
    targetType: 'inline'
    script: |
      cd "$(TF_DIR)"
      terraform plan -out=tfplan

- task: PowerShell@2
  displayName: 'Terraform Apply'
  inputs:
    targetType: 'inline'
    script: |
      cd "$(TF_DIR)"
      terraform apply -auto-approve tfplan
